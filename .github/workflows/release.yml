name: Publish experimental release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - name: Build installable archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('panasonic_cc_reliable.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(Path('custom_components/panasonic_cc_reliable').rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts:
                      archive.write(path, path.as_posix())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          name: Panasonic Comfort Cloud Reliable ${{ github.ref_name }}
          body_path: docs/RELEASE_v0.1.1.md
          files: panasonic_cc_reliable.zip
