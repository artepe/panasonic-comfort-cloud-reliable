[project]
name = "panasonic-comfort-cloud-reliable"
version = "0.1.1"
description = "Experimental Home Assistant Comfort Cloud integration with bounded polling and diagnostics"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.14", "beautifulsoup4==4.15.0"]

[project.optional-dependencies]
test = ["homeassistant==2026.10.1", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.17,<0.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
